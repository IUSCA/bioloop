server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # No access log: download URLs may carry short-lived bearer tokens.
    access_log off;
    client_max_body_size 26m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://api:3030/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve streaming TUS PATCH bodies and relative Location headers.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location /download/ {
        proxy_pass http://secure_download:3060/download/;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    # The preview transfer service streams in docker mode; never expose a raw alias.
    location /data/ { return 404; }
    location /rhythm/ { return 404; }
    location /grafana/ { return 404; }
}
