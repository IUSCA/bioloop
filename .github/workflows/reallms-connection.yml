# cspell:ignore REALLMS reallms rescloud pipefail isinstance urllib Qwen
# Compatibility checks only: no repository checkout or project code is sent.
name: REALLMS Connection Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/reallms-connection.yml'
  workflow_dispatch:

permissions: {}

jobs:
  models:
    name: Check REALLMS model compatibility
    # Fork PRs cannot access the repository's API key.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: List available models
        shell: bash
        env:
          REALLMS_API_KEY: ${{ secrets.REALLMS_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${REALLMS_API_KEY:-}" ]]; then
            echo '::error::Add the REALLMS_API_KEY repository secret before running this check.'
            exit 1
          fi

          # Keep TLS verification enabled and do not follow redirects or print headers.
          curl \
            --fail --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            --header "Authorization: Bearer ${REALLMS_API_KEY}" \
            --header 'Accept: application/json' \
            'https://reallms.rescloud.iu.edu/direct/v1/models' |
            python3 -c '
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except (ValueError, UnicodeError):
              sys.exit("::error::REALLMS returned invalid JSON.")

          data = payload.get("data") if isinstance(payload, dict) else None
          if not isinstance(data, list):
              sys.exit("::error::REALLMS did not return the expected model list.")

          models = sorted({
              item["id"]
              for item in data
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and item["id"].strip()
          })
          if not models:
              sys.exit("::error::No accessible models were returned for this API key.")

          print(f"REALLMS connection succeeded. Available models: {len(models)}")
          print(json.dumps(models, indent=2, ensure_ascii=True))
          '

      - name: Check chat responses and tool calls
        shell: bash
        env:
          REALLMS_API_KEY: ${{ secrets.REALLMS_API_KEY }}
          REALLMS_MODEL: Qwen3-Coder-Next
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          api_key = os.environ.get("REALLMS_API_KEY", "").strip()
          model = os.environ["REALLMS_MODEL"]
          if not api_key or "\n" in api_key or "\r" in api_key:
              sys.exit("::error::REALLMS_API_KEY is missing or contains invalid line breaks.")

          # Never forward the Authorization header to a redirected endpoint.
          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, new_url):
                  return None

          opener = build_opener(NoRedirects())

          def completion(label, **options):
              print(f"Checking {label} with {model}...", flush=True)
              body = {"model": model, "max_tokens": 256, "stream": False, **options}
              request = Request(
                  "https://reallms.rescloud.iu.edu/direct/v1/chat/completions",
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with opener.open(request, timeout=60) as response:
                      payload = json.load(response)
              except HTTPError as error:
                  sys.exit(f"::error::{label}: REALLMS returned HTTP {error.code}.")
              except (URLError, OSError):
                  sys.exit(f"::error::{label}: unable to reach REALLMS; check network access and TLS.")
              except (ValueError, UnicodeError):
                  sys.exit(f"::error::{label}: invalid request or JSON response.")

              choices = payload.get("choices") if isinstance(payload, dict) else None
              if not isinstance(choices, list) or not choices or not isinstance(choices[0], dict):
                  sys.exit(f"::error::{label}: no valid completion was returned.")
              message = choices[0].get("message")
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  sys.exit(f"::error::{label}: no assistant message was returned.")
              if choices[0].get("finish_reason") == "length":
                  sys.exit(f"::error::{label}: the completion exceeded the test token limit.")
              return message

          message = completion(
              "chat response",
              messages=[{"role": "user", "content": "Reply with exactly OK."}],
          )
          content = message.get("content")
          if not isinstance(content, str) or not content.strip():
              sys.exit("::error::Chat response check failed: no text response was returned.")
          print("Chat response check passed.", flush=True)

          # This fictional tool is advertised to the model but never executed.
          message = completion(
              "tool calling",
              messages=[{
                  "role": "user",
                  "content": "Call read_file with path sample.js. Do not answer in plain text.",
              }],
              tools=[{
                  "type": "function",
                  "function": {
                      "name": "read_file",
                      "description": "Read a fictional file for an API compatibility test.",
                      "parameters": {
                          "type": "object",
                          "properties": {"path": {"type": "string"}},
                          "required": ["path"],
                          "additionalProperties": False,
                      },
                  },
              }],
              tool_choice="auto",
          )
          calls = message.get("tool_calls")
          if not isinstance(calls, list) or len(calls) != 1 or not isinstance(calls[0], dict):
              sys.exit("::error::Tool calling check failed: expected one structured tool call.")
          call = calls[0]
          function = call.get("function")
          if (
              call.get("type") != "function"
              or not isinstance(call.get("id"), str)
              or not call["id"].strip()
              or not isinstance(function, dict)
              or function.get("name") != "read_file"
          ):
              sys.exit("::error::Tool calling check failed: invalid tool ID, type, or function name.")
          try:
              arguments = json.loads(function.get("arguments", ""))
          except (TypeError, ValueError):
              sys.exit("::error::Tool calling check failed: arguments must be a JSON string.")
          if arguments != {"path": "sample.js"}:
              sys.exit("::error::Tool calling check failed: unexpected file arguments.")
          print("Tool calling check passed. No file was read.")
          PY
