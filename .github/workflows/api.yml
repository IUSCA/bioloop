name: API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "bin/test_api_jest.sh"
      - "docker-compose-api-test.yml"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "bin/test_api_jest.sh"
      - "docker-compose-api-test.yml"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check lint without modifying files
        run: npm run lint:check

  test:
    name: Jest integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Jest against a disposable database
        run: bash bin/test_api_jest.sh
