name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    name: ${{ matrix.component }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [ui, api, secure_download]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.component }}
      - name: Lint without changing source
        run: npm run lint -- --no-fix
        working-directory: ${{ matrix.component }}
      - name: Build UI
        if: matrix.component == 'ui'
        working-directory: ui
        run: |
          mkdir -p .cert
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .cert/key.pem -out .cert/cert.pem -days 1 -subj /CN=localhost
          npm run build
      - name: Secure Download unit tests
        if: matrix.component == 'secure_download'
        run: npm test
        working-directory: secure_download

  workers:
    name: Worker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: pip install poetry==1.8.2
      - run: poetry check --lock
      - run: poetry install --no-root --only main --no-interaction
      - run: poetry run pip install pytest==8.3.5 pytest-timeout==2.3.1
      - run: poetry run python -m compileall -q workers
      - name: Existing upload integrity tests
        run: poetry run python -m pytest tests/upload/test_verify_upload_integrity.py

  orchestration:
    name: Preview safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: node --test tools/preview/validate-request.test.mjs
      - run: python3 -m unittest discover -s tools/preview -p 'test_*.py'
      - run: python3 -m compileall -q tools/preview
      - name: Shell syntax
        run: |
          for script in tools/preview/*.sh; do bash -n "$script"; done

  integration:
    name: Full-stack smoke
    # Playwright 1.43 installs Ubuntu 22.04 browser dependencies.
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compose startup and application smoke tests
        shell: bash
        run: |
          echo "PREVIEW_STATE_DIR=$RUNNER_TEMP/bioloop-ci" >> "$GITHUB_ENV"
          export PREVIEW_STATE_DIR="$RUNNER_TEMP/bioloop-ci"
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=30s 45m bash tools/preview/start.sh
      - name: Existing API Jest tests (non-watching)
        shell: bash
        run: |
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE"
          source tools/preview/common.sh
          timeout 4m docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose-preview.yml exec -T api npm run check -- --runInBand
      - name: Existing Playwright role smoke
        working-directory: tests
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
          TEST_API_BASE_URL: http://127.0.0.1:8080/api
          E2E_USERS_ADMIN_USERNAME: e2eAdmin
          E2E_USERS_OPERATOR_USERNAME: e2eOperator
          E2E_USERS_USER_USERNAME: e2eUser
          CI: 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=user_sidebar --project=admin_sidebar
      - name: Collect failure diagnostics
        if: failure()
        run: |
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE"
          source tools/preview/common.sh
          python3 tools/preview/diagnostics.py
          cat "$PREVIEW_STATE_DIR/diagnostics.txt"
      - name: Cleanup
        if: always()
        run: |
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE"
          bash tools/preview/cleanup.sh

  required:
    name: CI passed
    if: always()
    needs: [node-checks, workers, orchestration, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results=JSON.parse(process.env.RESULTS); if(!Object.values(results).every(job=>job.result==="success")) process.exit(1)'
