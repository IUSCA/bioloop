name: PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number targeting main
        required: true
        type: string
      duration:
        description: Review duration after readiness (minutes)
        type: choice
        options: ['60', '30', '120']
        default: '60'

permissions: {}

concurrency:
  group: preview-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      pr: ${{ steps.request.outputs.pr }}
      duration: ${{ steps.request.outputs.duration }}
      emails: ${{ steps.request.outputs.emails }}
    steps:
      - name: Require trusted main workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate authorization, PR, and CI
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DURATION: ${{ inputs.duration }}
          PREVIEW_ALLOWED_EMAILS: ${{ vars.PREVIEW_ALLOWED_EMAILS }}
        run: node tools/preview/validate-request.mjs

  preview:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions: {}
    env:
      PREVIEW_PR: ${{ needs.validate.outputs.pr }}
      PREVIEW_SHA: ${{ needs.validate.outputs.sha }}
      PREVIEW_DURATION: ${{ needs.validate.outputs.duration }}
      PREVIEW_ALLOWED_EMAILS: ${{ needs.validate.outputs.emails }}
      TRUSTED_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      # No checkout action/token in the job that executes contributor code.
      - name: Fetch public sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init trusted
          git -C trusted remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C trusted fetch --depth=1 origin "$TRUSTED_SHA"
          git -C trusted checkout --detach FETCH_HEAD
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --depth=1 origin "refs/pull/${PREVIEW_PR}/head"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$PREVIEW_SHA"
          git -C source checkout --detach "$PREVIEW_SHA"
      - name: Run isolated preview until expiration
        shell: bash
        run: |
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE/source"
          export PREVIEW_STATE_DIR="$RUNNER_TEMP/bioloop-preview"
          timeout --signal=TERM --kill-after=60s 175m bash trusted/tools/preview/run.sh
      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          export PREVIEW_SOURCE_DIR="$GITHUB_WORKSPACE/source"
          export PREVIEW_STATE_DIR="$RUNNER_TEMP/bioloop-preview"
          if [ -f trusted/tools/preview/cleanup.sh ]; then
            bash trusted/tools/preview/cleanup.sh
          fi
