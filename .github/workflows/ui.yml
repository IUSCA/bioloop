# Lint + production build for ui/. No deploy.
name: UI CI

on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Show Node and npm
        run: node -v && npm -v
        
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint:check

      - name: Build UI
        run: npm run build