# Lint + production build for ui/. No deploy.
name: UI CI

on:
  pull_request:
    paths:
      - "ui/**"
      - "tests/**"
      - "api/**"
      - "db/**"
      - "workers/**"
      - "rhythm/**"
      - "signet/**"
      - "bin/test_ui_e2e.sh"
      - "docker-compose*.yml"
      - "package.json"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "tests/**"
      - "api/**"
      - "db/**"
      - "workers/**"
      - "rhythm/**"
      - "signet/**"
      - "bin/test_ui_e2e.sh"
      - "docker-compose*.yml"
      - "package.json"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Show Node and npm
        run: node -v && npm -v
        
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build UI
        run: npm run build

  e2e:
    name: Full End-to-End Tests
    needs: check
    # Playwright 1.43 installs Ubuntu 22.04 (Jammy) system dependencies.
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run all Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
